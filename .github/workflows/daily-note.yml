name: Daily note

on:
  schedule:
    # 08:00 UTC daily (≈ 09:00 Bratislava in winter, 10:00 in summer)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a fresh test run (writes to test-*.json, won't render on /notes; close the PR after reviewing)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CIFRA_NOTES_CRON }}
          FORCE_NOTE: ${{ inputs.force == true && '1' || '' }}
        run: npm run note:generate

      - name: Check for new note
        id: check
        run: |
          NEW_FILE=$(git status --porcelain content/notes/ | awk '$1 == "??" || $1 == "A" {print $2}' | head -1)
          if [ -n "$NEW_FILE" ]; then
            echo "has_note=true" >> "$GITHUB_OUTPUT"
            echo "note_file=$NEW_FILE" >> "$GITHUB_OUTPUT"
            BASENAME=$(basename "$NEW_FILE" .json)
            echo "note_id=$BASENAME" >> "$GITHUB_OUTPUT"
          else
            echo "has_note=false" >> "$GITHUB_OUTPUT"
            echo "No new note produced (skipped or already existed)."
          fi

      - name: Open pull request
        if: steps.check.outputs.has_note == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE_FILE: ${{ steps.check.outputs.note_file }}
          NOTE_ID: ${{ steps.check.outputs.note_id }}
          IS_TEST: ${{ inputs.force == true && '1' || '' }}
        run: |
          set -euo pipefail
          BRANCH="note/${NOTE_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "$NOTE_FILE"

          TITLE=$(jq -r .title "$NOTE_FILE")
          URL=$(jq -r .url "$NOTE_FILE")
          SOURCE=$(jq -r .source "$NOTE_FILE")
          COMMENTARY=$(jq -r .commentary "$NOTE_FILE")

          if [ -n "$IS_TEST" ]; then
            PR_TITLE="[TEST] Note: ${TITLE}"
            COMMIT_MSG="Test note: ${TITLE}"
            FOOTER="Force-test run. **Close this PR — do not merge** (it would land a non-rendering test file in main)."
          else
            PR_TITLE="Note: ${TITLE}"
            COMMIT_MSG="Note: ${TITLE}"
            FOOTER="Auto-generated by the daily note workflow. Merge to publish, close to discard."
          fi

          git commit -m "$COMMIT_MSG"
          git push -u origin "$BRANCH"

          BODY=$(cat <<EOF
          **${TITLE}** · ${SOURCE}

          ${COMMENTARY}

          ${URL}

          ---
          ${FOOTER}
          EOF
          )

          gh pr create \
            --title "$PR_TITLE" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
