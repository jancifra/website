name: Daily note

on:
  schedule:
    # 08:00 UTC daily (≈ 09:00 Bratislava in winter, 10:00 in summer)
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate note
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run note:generate

      - name: Check for new note
        id: check
        run: |
          DATE=$(date -u +%Y-%m-%d)
          NOTE_FILE="content/notes/${DATE}.json"
          if [ -f "$NOTE_FILE" ] && [ -n "$(git status --porcelain "$NOTE_FILE")" ]; then
            echo "has_note=true" >> "$GITHUB_OUTPUT"
            echo "note_file=$NOTE_FILE" >> "$GITHUB_OUTPUT"
            echo "note_date=$DATE" >> "$GITHUB_OUTPUT"
          else
            echo "has_note=false" >> "$GITHUB_OUTPUT"
            echo "No new note produced (skipped or already existed)."
          fi

      - name: Open pull request
        if: steps.check.outputs.has_note == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE_FILE: ${{ steps.check.outputs.note_file }}
          NOTE_DATE: ${{ steps.check.outputs.note_date }}
          NOTE_TITLE: ${{ steps.gen.outputs.note_title }}
          NOTE_SOURCE: ${{ steps.gen.outputs.note_source }}
        run: |
          set -euo pipefail
          BRANCH="note/${NOTE_DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "$NOTE_FILE"
          git commit -m "Note: ${NOTE_TITLE}"
          git push -u origin "$BRANCH"

          # Build PR body
          URL=$(jq -r .url "$NOTE_FILE")
          TITLE=$(jq -r .title "$NOTE_FILE")
          SOURCE=$(jq -r .source "$NOTE_FILE")
          COMMENTARY=$(jq -r .commentary "$NOTE_FILE")

          BODY=$(cat <<EOF
          **${TITLE}** · ${SOURCE}

          ${COMMENTARY}

          ${URL}

          ---
          Auto-generated by the daily note workflow. Merge to publish, close to discard.
          EOF
          )

          gh pr create \
            --title "Note: ${TITLE}" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
