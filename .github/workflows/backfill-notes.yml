name: Backfill notes

# Manual one-off: fills Mon/Wed/Fri dates without a note in [from, to] and opens
# a single PR with all of them for review.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First date to backfill (YYYY-MM-DD)"
        required: true
      to:
        description: "Last date to backfill (YYYY-MM-DD)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Notes are generated sequentially with web search and each can take several
    # minutes. The script stops starting new dates at BACKFILL_BUDGET_MINUTES so
    # the PR step runs well before this timeout.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Backfill notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CIFRA_NOTES_CRON }}
          BACKFILL_FROM: ${{ inputs.from }}
          BACKFILL_TO: ${{ inputs.to }}
          BACKFILL_BUDGET_MINUTES: "100"
        run: npm run note:backfill

      - name: Open pull request
        # Still open a PR with whatever was written if the backfill step failed.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          NEW_FILES=$(git status --porcelain content/notes/ | awk '$1 == "??" {print $2}' | sort)
          if [ -z "$NEW_FILES" ]; then
            echo "No notes were backfilled."
            exit 0
          fi

          BRANCH="note/backfill-${FROM}-to-${TO}"
          COUNT=$(echo "$NEW_FILES" | wc -l | tr -d ' ')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          echo "$NEW_FILES" | xargs git add
          git commit -m "Backfill ${COUNT} notes (${FROM} – ${TO})"
          git push -u origin "$BRANCH"

          BODY=$(
            echo "Backfilled ${COUNT} notes for Mon/Wed/Fri dates between ${FROM} and ${TO}."
            echo
            for f in $NEW_FILES; do
              jq -r '"### \(.date) · \(.source)\n**\(.title)**\n\n\(.commentary)\n\n\(.url) (published \(.publishedAt[0:10]))\n"' "$f"
            done
            echo "---"
            echo "Auto-generated by the backfill workflow. Review each note, delete any you don't want from this branch, then merge to publish."
          )

          gh pr create \
            --title "Backfill ${COUNT} notes (${FROM} – ${TO})" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
